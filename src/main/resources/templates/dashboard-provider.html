<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>My Tasks · Connectly</title>
        <link rel="stylesheet" th:href="@{/css/style.css}">
    </head>
    <body>
        <header th:replace="~{fragments :: header}">
        </header>
        <main class="shell page">
            <div th:replace="~{fragments :: alerts}">
            </div>
            <div class="page-hero">
                <div><span class="eyebrow dark" th:text="${me.role.label}">SERVICE PROVIDER</span><h1>My assigned tasks</h1>
                </div><a class="btn btn-primary" th:href="@{/tasks}">View my tasks →</a></div>
            <div class="stat-grid">
                <div class="stat"><span class="stat-icon blue">▣</span><small>Assigned to me</small><strong th:text="${total}">0</strong></div>
                <div class="stat"><span class="stat-icon orange">◷</span><small>Outstanding</small><strong th:text="${active}">0</strong></div>
                <div class="stat"><span class="stat-icon green">✓</span><small>Resolved</small><strong th:text="${resolved}">0</strong></div>
            </div>
            <section class="panel">
                <div class="section-heading">
                    <div>
                        <h2>My latest tickets</h2>
                    </div><a class="text-link" th:href="@{/tasks}">See all →</a></div>
                <div th:replace="~{dashboard-parts :: ticketTable}">
                </div>
            </section>
        </main>
        <footer th:replace="~{fragments :: footer}">
        </footer>
    </body>
</html>
