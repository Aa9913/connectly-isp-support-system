<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Customers · Connectly</title>
        <link rel="stylesheet" th:href="@{/css/style.css}">
    </head>
    <body>
        <header th:replace="~{fragments :: header}">
        </header>
        <main class="shell page">
            <div class="page-hero">
                <div><span class="eyebrow dark">SYSTEM ADMINISTRATION</span><h1>Registered customers</h1>
                </div>
            </div>
            <section class="panel">
                <div class="table-wrap">
                    <table class="data-table">
                        <thead>
                            <tr><th>Customer name</th><th>Email</th><th>Phone</th><th>Registered</th></tr>
                        </thead>
                        <tbody>
                            <tr th:each="c:${customers}"><td th:text="${c.name}">Name</td><td th:text="${c.email}">Email</td><td th:text="${c.phone}">Phone</td><td th:text="${#temporals.format(c.createdAt,'dd MMM yyyy')}">Date</td></tr>
                        </tbody>
                    </table>
                    <div class="empty-state" th:if="${#lists.isEmpty(customers)}">No customers registered yet.</div>
                </div>
            </section>
        </main>
        <footer th:replace="~{fragments :: footer}">
        </footer>
    </body>
</html>
